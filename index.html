<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lusaka Public Transport Route Finder</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
  />
  <!-- <link href="https://unpkg.com" rel="stylesheet" /> -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>
  <div id="map"></div>

  <!-- Centered Loading Overlay -->
  <div id="loader-overlay" class="loader-overlay">
    <div class="spinner"></div>
    <p>Loading routes &amp; stops...</p>
  </div>


  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h2>Lusaka Public Transport</h2>
      <button id="toggle-sidebar-btn" class="toggle-btn" type="button" aria-label="Toggle panel"><i class="fa-solid fa-angles-down"></i></button>
    </div>
    <p class="subtitle">Type a stop name or click the map to set <strong>Origin</strong> and <strong>Destination</strong>.</p>

    <div class="controls">
        <div class="point-box">
          <span class="badge origin">A</span>
          <input id="origin-input" type="text" list="stops-datalist" placeholder="Type stop or click map for Origin" autocomplete="off" />
          <button id="locate-btn" class="locate-btn" type="button" title="Use my current GPS location" aria-label="Use my current GPS location"><i class="fa-solid fa-location-crosshairs"></i></button>
        </div>
        <div class="point-box">
          <span class="badge dest">B</span>
          <input id="dest-input" type="text" list="stops-datalist" placeholder="Type stop or click map for Destination" autocomplete="off" />
        </div>

        <button id="swap-btn" class="swap-btn" type="button" title="Swap Origin and Destination" aria-label="Swap Origin and Destination">⇅</button>

      <datalist id="stops-datalist"></datalist>
      <button id="reset-btn" type="button">Reset Points</button>


      <div id="status" class="status">Loading routes & stops...</div>
      <div id="results" class="results"></div>

      <!-- <footer class="sidebar-footer">
        <div>Data: <a href="https://gitlab.com/digitaltransport/data/africa/lusaka" target="_blank" rel="noopener noreferrer">Digital Transport for Africa (Lusaka)</a></div>
        <div>Map by <a href="https://jedidiahchibinga.wixsite.com/jedidiah-chibinga" target="_blank" rel="noopener noreferrer">Jedidiah Chibinga</a></div>
      </footer> -->
    </div>

  </div>
  
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="app.js"></script>
  <!-- <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <script src="app.js"></script> -->
</body>
</html>
